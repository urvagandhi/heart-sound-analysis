[project]
name = "heart-sound-analysis"
version = "0.1.0"
description = "Explainable AI for Heart Sound Analysis: Bridging Algorithmic Inference and Clinical Reasoning"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Core Numerical & ML (ml-base core)
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",

    # Computer Vision (ml-base cv)
    "torchvision>=0.15.0",

    # Audio & Signal Processing (PhysioNet Preprocessing & Feature Extraction)
    "torchaudio>=2.0.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",

    # Visualization (ml-base viz)
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # Explainable AI (Grad-CAM, Attention Rollout, SHAP)
    "shap>=0.42.0",

    # Data Storage & Utilities
    "h5py>=3.8.0",
    "tqdm>=4.65.0",
    "requests>=2.28.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest>=7.0.0",
]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
notebooks = [
    "jupyterlab",
    "ipykernel",
    "ipywidgets>=8.1.9",
]
cv = [
    "torchvision>=0.15.0",
]
audio = [
    "torchaudio>=2.0.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
]
xai = [
    "shap>=0.42.0",
]
nlp = [
    "transformers",
    "datasets",
    "accelerate",
    "huggingface-hub",
]
all = [
    { include-group = "dev" },
    { include-group = "viz" },
    { include-group = "notebooks" },
    { include-group = "cv" },
    { include-group = "audio" },
    { include-group = "xai" },
    { include-group = "nlp" },
]
